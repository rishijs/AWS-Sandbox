AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Barebones SAM app for local experimentation

Globals:
  Function:
    Timeout: 10

Parameters:
  BedrockModelId:
    Type: String
    Default: ""

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HelloFunction
      Handler: src/handler.handler
      Runtime: nodejs18.x
      Environment:
        Variables:
          BUCKET_NAME: !Ref InputBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${InputBucket}/*
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        Api:
          Type: Api
          Properties:
            Path: /hello
            Method: get

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  HelloFunctionName:
    Description: Lambda function name
    Value: !Ref HelloFunction
  InputBucketName:
    Description: S3 bucket for inputs
    Value: !Ref InputBucket
